[package]
name = "orphey"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.41", features = ["bundled", "serde_json"] }
dirs = "7.0.0"
serde_json = "1.0.154"
