[package]
name = "orphey-desktop"
version = "0.1.0"
description = "Orphey HTTP client"
edition = "2021"

[lib]
name = "orphey_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "orphey"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orphey = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["serde"] }

[features]
# Без этой фичи Tauri считает сборку dev и открывает devUrl (localhost:1420).
# Если Vite не запущен, окно остаётся белым. По умолчанию UI вшит в бинарник.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]